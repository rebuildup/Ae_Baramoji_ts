# Validates that PRs targeting `main` come from a `release-<major>-<minor>-<patch>`
# branch (policy §11 / ADR-0013). For non-`main` PRs (ticket branches stacked on
# a release branch), the check exits successfully without comment — stacked PR
# inspection belongs to the integration gate, not the source check.
#
# Status check name emitted: `release-source`
# Required check semantics: see `Protect main` ruleset + ADR-0013.

name: release-source-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check-release-source:
    name: validate release-x-y-z head when base=main
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify head branch matches release-x-y-z
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          PATTERN='^release-[0-9]+-[0-9]+-[0-9]+(-[A-Za-z0-9._-]+)?$'
          if [[ "$HEAD" =~ $PATTERN ]]; then
            echo "OK: head '$HEAD' matches release-x-y-z pattern (base=$BASE)"
            exit 0
          fi
          echo "::error::PR targets '$BASE' but head '$HEAD' does not match '$PATTERN'."
          echo "Public repository policy §11 + ADR-0013 require direct edits to '$BASE'"
          echo "to flow only through a 'release-<major>-<minor>-<patch>' integration branch."
          echo "Close this PR and open a new one whose base is the active release branch"
          echo "(or whose head is renamed to release-<major>-<minor>-<patch>)."
          exit 1

  pass-through:
    name: skip when base != main
    if: github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip — not a main-targeting PR
        run: |
          echo "OK: base is not 'main'; source-check N/A. Stacked PRs are validated"
          echo "by the integration gate and the eventual release-source re-check"
          echo "on the release → main PR."
