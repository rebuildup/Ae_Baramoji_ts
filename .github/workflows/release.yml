name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build, sync submodule, create GitHub Release
    runs-on: ubuntu-latest
    # Cap the job at 30 minutes: the entire release flow is a handful of
    # network calls, and a misbehaving fetch / PR open must not consume
    # billable runner minutes indefinitely.
    timeout-minutes: 30
    env:
      # Bot identity used by `bun run release:sync` for the submodule commit.
      GIT_AUTHOR_NAME: ae-baramoji-bot
      GIT_AUTHOR_EMAIL: bot@rebuildup.local
      GIT_COMMITTER_NAME: ae-baramoji-bot
      GIT_COMMITTER_EMAIL: bot@rebuildup.local
      # The sync script uses this to name the per-tag feature branch
      # (tmp/release-sync/<tag>) that bumps the parent submodule pointer.
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # GH_PAT must have write access to BOTH the parent repo and the
          # distribution repo (rebuildup/Ae_Baramoji). Default GITHUB_TOKEN
          # cannot push to a different repo.
          token: ${{ secrets.GH_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reset the submodule to origin/main BEFORE building anything that
      # depends on its working tree. Baramoji.zip is a tracked file in the
      # submodule; if we let sync-submodule.mjs reset later, it would
      # clobber the locally-built zip with origin/main's bytes right
      # before committing. Doing the reset up-front means the build sees a
      # clean submodule baseline.
      - name: Reset submodule to origin/main
        run: |
          set -euo pipefail
          git -C release/Ae_Baramoji fetch origin main
          git -C release/Ae_Baramoji checkout -B main FETCH_HEAD
          git -C release/Ae_Baramoji status --porcelain | sed 's/^/  submodule: /'

      - name: Build
        run: bun run build

      - name: Verify build outputs
        run: bun run verify

      # Build the published ZIP, then compute and verify its SHA-256 BEFORE
      # any remote push. A failed verify must not leave the distribution
      # repo / submodule branch updated.
      - name: Build ZIP, compute and verify checksums
        run: |
          bun run release:zip
          bun run release:checksums
          # checksums.txt records Baramoji.zip by basename; point verify at
          # the directory that holds the published zip in the submodule.
          bun run verify:zip dist/checksums.txt release/Ae_Baramoji

      # Sync to the submodule AFTER verification. The sync step is the only
      # place we push to the distribution repo + bump the parent pointer.
      - name: Sync to submodule
        run: bun run release:sync

      # Embed the checksums in the GitHub Release body so users can verify
      # downloads without opening a separate asset. softprops/action-gh-release
      # reads `body_path` for the release notes.
      - name: Build release body
        run: |
          {
            echo "## SHA-256 checksums"
            echo ""
            echo '```'
            cat dist/checksums.txt
            echo '```'
            echo ""
            echo "Verify locally with \`sha256sum -c checksums.txt\` next to Baramoji.zip,"
            echo "or download \`checksums.txt\` next to \`Baramoji.zip\` and compare the \`Baramoji.zip\` line."
          } > release-notes-body.md
          ls -l release-notes-body.md

      # main is branch-protected; the sync script pushes the parent pointer
      # bump to a per-tag feature branch. Open a PR from that branch and
      # merge it with the GH_PAT (which has admin perms for this repo).
      - name: Open and merge parent pointer PR
        run: |
          set -euo pipefail
          BRANCH="tmp/release-sync/${RELEASE_TAG}"
          # Skip silently if no parent commit was produced (e.g. no submodule
          # change since the previous sync).
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::Branch $BRANCH does not exist on origin; skipping PR step"
            exit 0
          fi
          # Open the PR if one doesn't already exist for this head branch.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "::notice::PR for $BRANCH already exists; reusing"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): bump submodule pointer for ${RELEASE_TAG}" \
              --body "Automated submodule pointer for ${RELEASE_TAG}."
          fi
          # Wait for required status checks to finish before merging.
          # `gh pr merge` runs immediately and races against queued checks;
          # the repo has auto-merge disabled, so we cannot rely on a
          # background merge once the required gate turns green. Watching
          # `--required` until completion (pass or fail) keeps the release
          # job from succeeding on a half-checked PR. `--fail-fast` aborts
          # the watch the moment any required check fails so we don't keep
          # polling a doomed PR.
          if ! gh pr checks "$BRANCH" --required --watch --fail-fast; then
            echo "::error::Required checks did not pass for $BRANCH; refusing to merge."
            exit 1
          fi
          gh pr merge "$BRANCH" --squash --delete-branch --body "Automated release sync for ${RELEASE_TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/Ae_Baramoji/Baramoji.zip
            dist/checksums.txt
          generate_release_notes: true
          body_path: release-notes-body.md